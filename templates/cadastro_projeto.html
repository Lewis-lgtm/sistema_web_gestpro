<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Projeto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Sistema de Gestão de Tarefas</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Início</a></li>
                <li><a href="{{ url_for('tarefas') }}">Ver Tarefas</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Cadastrar Novo Projeto</h2>
        <form method="POST">
            <label for="nome">Nome do Projeto</label>
            <input type="text" id="nome" name="nome" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" required></textarea>

            <label for="data_inicio">Data de Início</label>
            <input type="date" id="data_inicio" name="data_inicio" required>

            <label for="data_fim">Data de Fim</label>
            <input type="date" id="data_fim" name="data_fim" required>

            <label for="cliente">Cliente</label>
            <input type="text" id="cliente" name="cliente" required>

            <label for="responsavel">Responsável</label>
            <select id="responsavel" name="responsavel" required>
                {% for pessoa in pessoas %}
                    <option value="{{ pessoa.Pessoa_ID }}">{{ pessoa.Pessoa_Nome }}</option>
                {% endfor %}
            </select>

            <label for="horas_estimadas">Horas Estimadas</label>
            <input type="number" step="0.01" id="horas_estimadas" name="horas_estimadas" required>

            <button type="submit">Cadastrar Projeto</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Sistema de Tarefas. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
