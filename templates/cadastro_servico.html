<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Serviço para o Projeto: {{ projeto.Projeto_Nome }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Sistema de Gestão de Tarefas</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Início</a></li>
                <li><a href="{{ url_for('cadastro_tarefa') }}">Cadastrar Nova Tarefa</a></li>
                <li><a href="{{ url_for('cadastro_projeto') }}">Cadastrar Novo Projeto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Cadastrar Serviço para o Projeto: {{ projeto.Projeto_Nome }}</h2>
        <form method="POST" action="{{ url_for('cadastro_servico', projeto_id=projeto.Projeto_ID) }}">
            <label for="titulo">Título do Serviço</label>
            <input type="text" id="titulo" name="titulo" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" required></textarea>

            <label for="tipo_servico">Tipo de Serviço</label>
            <select id="tipo_servico" name="tipo_servico" required>
                {% for tipo in tipos_servicos %}
                    <option value="{{ tipo.TipoServico_ID }}">{{ tipo.TipoServico_Titulo }}</option>
                {% endfor %}
            </select>

            <button type="submit">Cadastrar Serviço</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Sistema de Tarefas. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
