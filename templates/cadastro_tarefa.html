<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Tarefa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Sistema de Gestão de Tarefas</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Início</a></li> <!-- Correção aqui -->
                <li><a href="{{ url_for('index') }}">Ver Tarefas</a></li> <!-- Correção aqui -->
            </ul>
        </nav>
    </header>
    <main>
        <h2>Cadastrar Nova Tarefa</h2>
        <form action="{{ url_for('cadastro_tarefa') }}" method="POST">
            <div class="form-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao"></textarea>
            </div>

            <div class="form-group">
                <label for="horas_est">Horas Estimadas:</label>
                <input type="number" id="horas_est" name="horas_est" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="data_inicio">Data de Início:</label>
                <input type="date" id="data_inicio" name="data_inicio" required>
            </div>

            <div class="form-group">
                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    {% for status in status_tarefas %}
                        <option value="{{ status.StatusTarefa_ID }}">{{ status.StatusTarefa_Titulo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="tipo_tarefa">Tipo de Tarefa:</label>
                <select id="tipo_tarefa" name="tipo_tarefa" required>
                    {% for tipo in tipos_tarefas %}
                        <option value="{{ tipo.TipoTarefa_ID }}">{{ tipo.TipoTarefa_Titulo }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Cadastrar Tarefa</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Sistema de Tarefas. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
