<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Responsável</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Sistema de Gestão de Tarefas</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Início</a></li>
                <li><a href="{{ url_for('tarefas') }}">Ver Tarefas</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Cadastrar Novo Responsável</h2>
        <form method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="nivel_senioridade">Nível de Senioridade</label>
            <input type="text" id="nivel_senioridade" name="nivel_senioridade" required>

            <label for="custo_por_hora">Custo por Hora</label>
            <input type="number" step="0.01" id="custo_por_hora" name="custo_por_hora" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Cadastrar Responsável</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Sistema de Tarefas. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
