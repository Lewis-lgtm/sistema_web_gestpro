<form method="POST">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>

    <label for="nivel_senioridade">Nível de Senioridade</label>
    <input type="text" id="nivel_senioridade" name="nivel_senioridade" required>

    <label for="custo_por_hora">Custo por Hora</label>
    <input type="number" step="0.01" id="custo_por_hora" name="custo_por_hora" required>

    <!-- Aqui está o campo de email que você precisa adicionar -->
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">Cadastrar Responsável</button>
</form>
